<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>800+ Pharmacy POS</title>
<style>
:root{--red:#b3121b;--red2:#8a0d14;--gold:#d4a017;--bg:#faf6ee;--card:#fff;--tx:#241a14;--mut:#7a6d62;--bd:#e6dccb;--ok:#2e7d32;--warn:#c77700;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1210;--card:#261b18;--tx:#f5ece0;--mut:#b3a291;--bd:#3d2d27;--red:#d02a33;--ok:#66bb6a;--warn:#ffb74d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1210;--card:#261b18;--tx:#f5ece0;--mut:#b3a291;--bd:#3d2d27;--red:#d02a33;--ok:#66bb6a;--warn:#ffb74d;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(90deg,var(--red2),var(--red));color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold);flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px}.logo b{color:var(--gold)}
.sp{flex:1}.who{font-size:13px;opacity:.9}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:8px}
button.p{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
button.g{background:var(--gold);border-color:var(--gold);color:#2b1d00;font-weight:600}
button.x{color:var(--red)}header button{background:transparent;color:#fff;border-color:#ffffff66}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);width:100%}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.wrap{padding:14px;max-width:1300px;margin:0 auto}
.pos{display:grid;grid-template-columns:1fr 380px;gap:14px}@media(max-width:860px){.pos{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.prod{text-align:left;padding:10px;border-top:3px solid var(--gold)}.prod:disabled{opacity:.45}
.prod .n{font-weight:600}.prod .pr{color:var(--red);font-weight:700;margin-top:4px}.sm{font-size:12px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--gold);color:#2b1d00;margin-right:3px}.tag.r{background:var(--red);color:#fff}.tag.w{background:var(--warn);color:#fff}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mut);font-size:12px}
.tbl{overflow-x:auto}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}.stat b{display:block;font-size:22px;color:var(--red)}
.tot{display:flex;justify-content:space-between;padding:3px 0}.tot.big{font-size:20px;font-weight:800;color:var(--red);border-top:2px solid var(--gold);margin-top:6px;padding-top:8px}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:14px;z-index:50}#modal.on{display:flex}
.mb{background:var(--card);color:var(--tx);border-radius:14px;padding:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto;border-top:4px solid var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.login{max-width:360px;margin:8vh auto}.err{color:var(--red);font-size:13px;margin-top:8px}
.rc{font-family:ui-monospace,Menlo,monospace;font-size:13px}.rc hr{border:0;border-top:1px dashed var(--mut)}
@media print{body>*:not(#modal){display:none!important}#modal{position:static;background:none;display:block!important}.mb{border:0;max-height:none}.noprint{display:none}}
.shell{display:grid;grid-template-columns:210px 1fr 370px;min-height:100vh}
aside{background:linear-gradient(180deg,var(--red2),var(--red));color:#fff;padding:14px;display:flex;flex-direction:column;gap:10px;border-right:3px solid var(--gold)}
aside h3{margin:6px 0 0}.sm2{font-size:11px;opacity:.8;letter-spacing:.5px}
.sc{background:#ffffff1f;border:1px solid #ffffff33;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;font-size:11px}.sc b{font-size:20px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:6px}.qa button{background:#ffffff1f;color:#fff;border-color:#ffffff40;font-size:12px;padding:8px 4px}
main{padding:14px;overflow:auto}.sbar{display:flex;gap:8px}.sbar input{border:2px solid var(--gold)}
.rail{background:var(--card);border-left:1px solid var(--bd);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow:auto}
.rb{padding:14px;border-bottom:1px solid var(--bd)}.rh{font-weight:800;letter-spacing:.5px;margin-bottom:8px}.rh2{font-size:12px;color:var(--mut);letter-spacing:.5px;margin-bottom:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.seg button.on,.pays button.on{border-color:var(--gold);background:#d4a01726;font-weight:700}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.qk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.bigin{font-size:22px;text-align:right}.go{width:100%;padding:14px;font-size:16px;background:linear-gradient(90deg,var(--red),var(--red2));color:#fff;border:0;font-weight:700;margin-top:12px}
.foot{margin-top:auto;position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 14px;display:flex;gap:8px;align-items:center}
.emp{text-align:center;color:var(--mut);padding:60px 0}
.bar{background:#241a14;color:var(--gold);text-align:center;padding:7px;font-size:13px;font-weight:600}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;max-width:1000px;margin:6vh auto;padding:0 18px}
.hero h1{font-size:44px;line-height:1.05;margin:12px 0}.gr{background:linear-gradient(90deg,var(--red),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{background:#d4a01722;border:1px solid var(--gold);padding:4px 12px;border-radius:99px;font-size:12px}
.mark{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--red),var(--gold));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
@media(max-width:900px){.shell{grid-template-columns:1fr}.rail{height:auto;position:static}aside{flex-direction:row;flex-wrap:wrap}.hero{grid-template-columns:1fr}.hero h1{font-size:32px}}
</style>

<div id="app"></div><div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const $=id=>document.getElementById(id), v=id=>$(id).value;
const RATE={none:0,senior:.2,pwd:.2};
let db=null,S={users:[],products:[],suppliers:[],sales:[],stockins:[],me:null,cart:[],tab:'dash',q:'',disc:'none',range:'today',ok:0,err:''};
try{S.me=sessionStorage.getItem('me')}catch(e){}
const days=e=>e?Math.floor((new Date(e+'T23:59:59')-Date.now())/864e5):9999;
const expTag=e=>{const d=days(e);return d<0?'<span class="tag r">Expired</span>':d<90?'<span class="tag w">Exp in '+d+'d</span>':''};
const user=()=>S.users.find(u=>u.username===S.me);
const prod=id=>S.products.find(p=>p.id===id);
function modal(h){$('modal').innerHTML='<div class="mb">'+h+'</div>';$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}

function render(){
  const a=$('app');
  if(!S.me||!user()){return a.innerHTML=loginHTML()}
  const u=user();
  a.innerHTML='<header><div class="logo">800<b>+</b> Pharmacy</div><span class="sm" style="color:#fff">'+(u.role==='admin'?'Admin':'Cashier')+'</span><div class="sp"></div><span class="who">'+esc(u.name||u.username)+'</span><button onclick="logout()">Log out</button></header><div class="wrap">'+(u.role==='admin'?adminHTML():posHTML())+'</div>';
}

function gridHTML(){const q=S.q.toLowerCase();const l=S.products.filter(p=>!q||[p.name,p.generic,p.category].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));

function addCart(id){const p=prod(id),c=S.cart.find(x=>x.id===id);if(c){if(c.qty<p.stock)c.qty++}else S.cart.push({id,qty:1});$('cart').innerHTML=cartHTML()}

function calc(){const sub=S.cart.reduce((s,c)=>s+(prod(c.id)?.price||0)*c.qty,0),disc=sub*RATE[S.disc];return{sub,disc,tot:sub-disc,rx:S.cart.some(c=>prod(c.id)?.rx)}}
function cartHTML(){const t=calc();
  const rows=S.cart.map(c=>{const p=prod(c.id);return '<tr><td>'+esc(p.name)+(p.rx?' <span class="tag r">Rx</span>':'')+'<div class="sm">'+peso(p.price)+'</div></td><td style="white-space:nowrap"><button onclick="qty(\''+c.id+'\',-1)">−</button> '+c.qty+' <button onclick="qty(\''+c.id+'\',1)">+</button></td><td style="text-align:right">'+peso(p.price*c.qty)+'</td></tr>'}).join('');
  return '<h3 style="margin:0 0 8px;color:var(--red)">Current sale</h3>'+(rows?'<table>'+rows+'</table>':'<div class="sm">Tap a product to add it.</div>')+
  '<label>Discount</label><select onchange="S.disc=this.value;$(\'cart\').innerHTML=cartHTML()"><option value="none">None</option><option value="senior"'+(S.disc==='senior'?' selected':'')+'>Senior Citizen (20%)</option><option value="pwd"'+(S.disc==='pwd'?' selected':'')+'>PWD (20%)</option></select>'+
  (S.disc!=='none'?'<label>ID number</label><input id="idn" value="'+esc(S.idn||'')+'" oninput="S.idn=this.value">':'')+
  '<div style="margin-top:10px"><div class="tot"><span>Subtotal</span><span>'+peso(t.sub)+'</span></div><div class="tot"><span>Discount</span><span>−'+peso(t.disc)+'</span></div><div class="tot big"><span>Total</span><span>'+peso(t.tot)+'</span></div></div>'+
  (t.rx?'<label style="display:flex;gap:8px;align-items:center;color:var(--red)"><input type="checkbox" id="rxok" style="width:auto"> Valid prescription verified</label>':'')+
  '<label>Cash received</label><input id="cash" type="number" min="0" step="0.01"><div style="display:flex;gap:8px;margin-top:12px"><button class="x" onclick="S.cart=[];S.disc=\'none\';$(\'cart\').innerHTML=cartHTML()">Clear</button><button class="p" style="flex:1" onclick="checkout()">Complete sale</button></div><div class="err" id="ce"></div>'}
async function checkout(){const t=calc(),e=$('ce');
  if(!S.cart.length){e.textContent='Cart is empty.';return}
  if(t.rx&&!$('rxok').checked){e.textContent='Confirm the prescription first.';return}
  if(S.disc!=='none'&&!(S.idn||'').trim()){e.textContent='Enter the discount ID number.';return}
  const cash=parseFloat(v('cash'));if(!(cash>=t.tot)){e.textContent='Cash received is less than the total.';return}
  for(const c of S.cart){const p=prod(c.id);if(!p||p.stock<c.qty||days(p.expiry)<0){e.textContent='Stock or expiry problem with '+(p?p.name:'an item')+'.';return}}
  const s={ts:Date.now(),cashier:S.me,items:S.cart.map(c=>({id:c.id,name:prod(c.id).name,qty:c.qty,price:prod(c.id).price})),subtotal:t.sub,discType:S.disc,idNo:S.disc!=='none'?S.idn:'',discount:t.disc,total:t.tot,cash,change:cash-t.tot,rx:t.rx};
  try{for(const c of S.cart)await db.collection('products').doc(c.id).update({stock:prod(c.id).stock-c.qty});const r=await db.collection('sales').add(s);S.cart=[];S.disc='none';S.idn='';receipt(s,r.id)}catch(x){e.textContent='Could not save sale: '+(x.message||x.code)}}

  else if(n==='sales'){const m={};(await pageAll('sale_costs','sale_id')).forEach(r=>m[r.sale_id]=+r.cost_total);S.sales.forEach(s=>s.cost=m[s.id]||0)}}catch(e){}}

const D0=()=>new Date(new Date().setHours(0,0,0,0)).getTime();
const profit=s=>s.total-(s.cost||0);
function rng(r){const n=new Date(),d0=D0();
  if(r==='today')return[d0,d0+864e5,d0-864e5,d0];
  if(r==='week'){const s=d0-6*864e5;return[s,d0+864e5,s-7*864e5,s]}
  const s=new Date(n.getFullYear(),n.getMonth(),1).getTime();return[s,new Date(n.getFullYear(),n.getMonth()+1,1).getTime(),new Date(n.getFullYear(),n.getMonth()-1,1).getTime(),s]}
const rcp=s=>{const d=new Date(s.ts),p=n=>String(n).padStart(2,'0'),h=parseInt(String(s.id).replace(/-/g,'').slice(0,6),16);return 'RCP-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+String((h||0)%10000).padStart(4,'0')}
function buckets(m){const now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),dow=(d0.getDay()+6)%7,b=[];
  if(m==='daily'){for(let i=0;i<7;i++){const s=new Date(d0);s.setDate(d0.getDate()-dow+i);const e=new Date(s);e.setDate(s.getDate()+1);b.push([s.getTime(),e.getTime(),s.toLocaleDateString('en-US',{weekday:'short'})])}}
  else if(m==='weekly'){for(let i=7;i>=0;i--){const s=new Date(d0);s.setDate(d0.getDate()-dow-7*i);const e=new Date(s);e.setDate(s.getDate()+7);b.push([s.getTime(),e.getTime(),s.toLocaleDateString('en-US',{month:'short',day:'numeric'})])}}
  else if(m==='monthly'){for(let i=0;i<12;i++){const s=new Date(now.getFullYear(),i,1);b.push([s.getTime(),new Date(now.getFullYear(),i+1,1).getTime(),s.toLocaleDateString('en-US',{month:'short'})])}}
  else{for(let i=4;i>=0;i--){const y=now.getFullYear()-i;b.push([new Date(y,0,1).getTime(),new Date(y+1,0,1).getTime(),String(y)])}}
  return b}
function nice(m){if(!(m>0))return 1000;const p=Math.pow(10,Math.floor(Math.log10(m))),f=m/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
const kfmt=n=>n>=1e6?'₱'+(+(n/1e6).toFixed(1))+'M':n>=1e3?'₱'+(+(n/1e3).toFixed(1))+'k':'₱'+(+n.toFixed(0));

    mx=nice(Math.max.apply(null,vals.map(x=>x[0]).concat(0))),tk=[0,1,2,3,4].map(i=>mx/4*i);

  modal('<h3 style="margin-top:0;color:var(--red)">'+(id?'Edit':'Add')+' product</h3><label>Brand / name</label><input id="f1" value="'+esc(p.name)+'"><label>Generic name</label><input id="f2" value="'+esc(p.generic)+'"><label>Barcode</label><input id="f10" value="'+esc(p.barcode)+'">'+
  '<div class="row2"><div><label>Category</label><input id="f3" value="'+esc(p.category)+'"></div><div><label>Supplier</label><select id="f8"><option value="">—</option>'+S.suppliers.map(s=>'<option value="'+s.id+'"'+(s.id===p.supplier?' selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></div>'+
  '<div><label>Unit cost (₱) — what you paid</label><input id="f11" type="number" min="0" step="0.01" inputmode="decimal" value="'+esc(p.cost>0?p.cost:'')+'" oninput="mgPrev()"></div><div><label>Sale price (₱) — what you charge</label><input id="f4" type="number" min="0" step="0.01" inputmode="decimal" value="'+esc(p.price)+'" oninput="mgPrev()"></div>'+
  '<div><label>Stock</label><input id="f5" type="number" value="'+esc(p.stock||0)+'"></div><div><label>Reorder level</label><input id="f6" type="number" value="'+esc(p.reorder==null?10:p.reorder)+'"></div><div><label>Expiry date</label><input id="f7" type="date" value="'+esc(p.expiry)+'"></div></div>'+
  '<div class="hint" id="mgn"></div><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="f9" style="width:auto"'+(p.rx?' checked':'')+'> Prescription-only (Rx)</label><div style="display:flex;gap:8px;margin-top:14px"><button onclick="closeModal()">Cancel</button><button class="p" style="flex:1" onclick="saveProd(\''+(id||'')+'\')">Save</button></div><div class="err" id="fe"></div>');mgPrev()}
async function saveProd(id){const pr=parseFloat(v('f4')),co=parseFloat(v('f11')||'0'),e=$('fe');
  if(!v('f1').trim()||!(pr>=0)){e.textContent='Name and sale price are required.';return}
  if(!(co>=0)){e.textContent='Unit cost must be 0 or more.';return}
  if(co>pr&&!confirm('Unit cost is higher than the sale price. Save anyway?'))return;
  const d={name:v('f1').trim(),generic:v('f2').trim(),barcode:v('f10').trim()||null,category:v('f3').trim(),price:pr,stock:parseInt(v('f5'))||0,reorder:parseInt(v('f6'))||0,expiry:v('f7')||null,supplier_id:v('f8')||null,rx:$('f9').checked};
  let r,pid=id;
  if(id)r=await sb.from('products').update(d).eq('id',id);else{r=await sb.from('products').insert(d).select('id').single();pid=r.data&&r.data.id}
  if(r.error){e.textContent=r.error.message;return}
  const c=await sb.from('product_costs').upsert({product_id:pid,cost:co||0});
  if(c.error){e.textContent='Product saved, but unit cost was not: '+c.error.message+' (run migration.sql in Supabase first)';await load('products');return}
  closeModal();await load('products');render()}

/* ---- export every product (with unit cost) to a CSV file that opens in Excel / Google Sheets ---- */
function exportInv(){
  const c=x=>{x=x==null?'':String(x);return /[",\n\r]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
  const head=['Name','Generic name','Category','Barcode','Unit cost','Sale price','Stock','Reorder level','Expiry date','Supplier','Prescription only'];
  const rows=S.products.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>[p.name,p.generic,p.category,p.barcode,p.cost||0,p.price,p.stock,p.reorder,p.expiry,(S.suppliers.find(s=>s.id===p.supplier)||{}).name||'',p.rx?'Yes':'No'].map(c).join(','));
  const blob=new Blob(['﻿'+[head.map(c).join(',')].concat(rows).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='800plus-inventory-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
