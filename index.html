<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>800+ Pharmacy POS</title>
<style>
:root{--red:#b3121b;--red2:#8a0d14;--gold:#d4a017;--bg:#faf6ee;--card:#fff;--tx:#241a14;--mut:#7a6d62;--bd:#e6dccb;--ok:#2e7d32;--warn:#c77700;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#1a1210;--card:#261b18;--tx:#f5ece0;--mut:#b3a291;--bd:#3d2d27;--red:#d02a33;--ok:#66bb6a;--warn:#ffb74d;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(90deg,var(--red2),var(--red));color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold);flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px}.logo b{color:var(--gold)}
.sp{flex:1}.who{font-size:13px;opacity:.9}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:8px}
button.p{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
button.g{background:var(--gold);border-color:var(--gold);color:#2b1d00;font-weight:600}
button.x{color:var(--red)}header button{background:transparent;color:#fff;border-color:#ffffff66}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);width:100%}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.wrap{padding:14px;max-width:1300px;margin:0 auto}
.pos{display:grid;grid-template-columns:1fr 380px;gap:14px}@media(max-width:860px){.pos{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.prod{text-align:left;padding:10px;border-top:3px solid var(--gold)}.prod:disabled{opacity:.45}
.prod .n{font-weight:600}.prod .pr{color:var(--red);font-weight:700;margin-top:4px}.sm{font-size:12px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--gold);color:#2b1d00;margin-right:3px}.tag.r{background:var(--red);color:#fff}.tag.w{background:var(--warn);color:#fff}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mut);font-size:12px}
.tbl{overflow-x:auto}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}.stat b{display:block;font-size:22px;color:var(--red)}
.tot{display:flex;justify-content:space-between;padding:3px 0}.tot.big{font-size:20px;font-weight:800;color:var(--red);border-top:2px solid var(--gold);margin-top:6px;padding-top:8px}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:14px;z-index:50}#modal.on{display:flex}
.mb{background:var(--card);color:var(--tx);border-radius:14px;padding:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto;border-top:4px solid var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.login{max-width:360px;margin:8vh auto}.err{color:var(--red);font-size:13px;margin-top:8px}
.rc{font-family:ui-monospace,Menlo,monospace;font-size:13px}.rc hr{border:0;border-top:1px dashed var(--mut)}
@media print{body>*:not(#modal){display:none!important}#modal{position:static;background:none;display:block!important}.mb{border:0;max-height:none}.noprint{display:none}}
.shell{display:grid;grid-template-columns:210px 1fr 370px;min-height:100vh}
aside{background:linear-gradient(180deg,var(--red2),var(--red));color:#fff;padding:14px;display:flex;flex-direction:column;gap:10px;border-right:3px solid var(--gold)}
aside h3{margin:6px 0 0}.sm2{font-size:11px;opacity:.8;letter-spacing:.5px}
.sc{background:#ffffff1f;border:1px solid #ffffff33;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;font-size:11px}.sc b{font-size:20px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:6px}.qa button{background:#ffffff1f;color:#fff;border-color:#ffffff40;font-size:12px;padding:8px 4px}
main{padding:14px;overflow:auto}.sbar{display:flex;gap:8px}.sbar input{border:2px solid var(--gold)}
.rail{background:var(--card);border-left:1px solid var(--bd);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow:auto}
.rb{padding:14px;border-bottom:1px solid var(--bd)}.rh{font-weight:800;letter-spacing:.5px;margin-bottom:8px}.rh2{font-size:12px;color:var(--mut);letter-spacing:.5px;margin-bottom:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.seg button.on,.pays button.on{border-color:var(--gold);background:#d4a01726;font-weight:700}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.qk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.bigin{font-size:22px;text-align:right}.go{width:100%;padding:14px;font-size:16px;background:linear-gradient(90deg,var(--red),var(--red2));color:#fff;border:0;font-weight:700;margin-top:12px}
.foot{margin-top:auto;position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 14px;display:flex;gap:8px;align-items:center}
.emp{text-align:center;color:var(--mut);padding:60px 0}
.bar{background:#241a14;color:var(--gold);text-align:center;padding:7px;font-size:13px;font-weight:600}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;max-width:1000px;margin:6vh auto;padding:0 18px}
.hero h1{font-size:44px;line-height:1.05;margin:12px 0}.gr{background:linear-gradient(90deg,var(--red),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{background:#d4a01722;border:1px solid var(--gold);padding:4px 12px;border-radius:99px;font-size:12px}
.mark{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--red),var(--gold));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
@media(max-width:900px){.shell{grid-template-columns:1fr}.rail{height:auto;position:static}aside{flex-direction:row;flex-wrap:wrap}.hero{grid-template-columns:1fr}.hero h1{font-size:32px}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

body.cash .bc{font:11px ui-monospace,Menlo,monospace;color:var(--mut);opacity:.85}
body.cash .pl .pc{flex-direction:row;align-items:center;gap:14px;padding:10px 14px}
body.cash .pl .pb{flex:1;min-width:0}body.cash .pl .pf{margin:0;border:0;padding:0;flex-direction:row;align-items:center;gap:16px}

body.cash .cn{min-width:0;font-size:13px}body.cash .cn b{font-weight:600}

body.cash .ct{font-weight:700;font-variant-numeric:tabular-nums;min-width:64px;text-align:right}body.cash .cx{padding:2px 7px;border-radius:8px}

</style></head><body>
<div id="app"></div><div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const $=id=>document.getElementById(id), v=id=>$(id).value;
const RATE={none:0,senior:.2,pwd:.2};
let db=null,S={users:[],products:[],suppliers:[],sales:[],stockins:[],me:null,cart:[],tab:'dash',q:'',disc:'none',range:'today',ok:0,err:''};
try{S.me=sessionStorage.getItem('me')}catch(e){}
const days=e=>e?Math.floor((new Date(e+'T23:59:59')-Date.now())/864e5):9999;
const expTag=e=>{const d=days(e);return d<0?'<span class="tag r">Expired</span>':d<90?'<span class="tag w">Exp in '+d+'d</span>':''};
const user=()=>S.users.find(u=>u.username===S.me);
const prod=id=>S.products.find(p=>p.id===id);
function modal(h){$('modal').innerHTML='<div class="mb">'+h+'</div>';$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}

function render(){
  const a=$('app');
  if(!S.me||!user()){return a.innerHTML=loginHTML()}
  const u=user();
  a.innerHTML='<header><div class="logo">800<b>+</b> Pharmacy</div><span class="sm" style="color:#fff">'+(u.role==='admin'?'Admin':'Cashier')+'</span><div class="sp"></div><span class="who">'+esc(u.name||u.username)+'</span><button onclick="logout()">Log out</button></header><div class="wrap">'+(u.role==='admin'?adminHTML():posHTML())+'</div>';
}
function loginHTML(){return '<header><div class="logo">800<b>+</b> Pharmacy</div></header><div class="login card"><h2 style="margin-top:0;color:var(--red)">Sign in</h2><label>Username</label><input id="lu" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')login()"><div style="margin-top:14px"><button class="p" style="width:100%" onclick="login()">Log in</button></div><div class="err" id="le">'+esc(S.err)+'</div>'+(S.ok&&S.users.length===1&&S.users[0].password==='admin123'?'<p class="sm">First run: log in as <b>admin</b> / <b>admin123</b>, then change the password in Users.</p>':'')+'</div>'}
function login(){const u=S.users.find(x=>x.username===v('lu').trim().toLowerCase()&&x.password===v('lp'));if(!u){$('le').textContent=S.ok?'Wrong username or password.':'Not connected yet.';return}S.me=u.username;try{sessionStorage.setItem('me',S.me)}catch(e){}S.tab='dash';S.cart=[];render()}
function logout(){S.me=null;try{sessionStorage.removeItem('me')}catch(e){}render()}

/* ---------- CASHIER ---------- */
function posHTML(){return '<div class="pos"><div class="card"><input id="q" placeholder="Search medicine, generic name, category…" value="'+esc(S.q)+'" oninput="S.q=this.value;$(\'grid\').innerHTML=gridHTML()"><div class="grid" id="grid">'+gridHTML()+'</div></div><div class="card" id="cart">'+cartHTML()+'</div></div>'}
function gridHTML(){const q=S.q.toLowerCase();const l=S.products.filter(p=>!q||[p.name,p.generic,p.category].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  if(!l.length)return '<div class="sm">No products found.</div>';
  return l.map(p=>{const ex=days(p.expiry)<0;return '<button class="prod card" '+(p.stock<=0||ex?'disabled':'')+' onclick="addCart(\''+p.id+'\')"><div class="n">'+esc(p.name)+'</div><div class="sm">'+esc(p.generic||p.category||'')+'</div><div class="pr">'+peso(p.price)+'</div><div class="sm">Stock: '+p.stock+'</div><div>'+(p.rx?'<span class="tag r">Rx</span>':'')+expTag(p.expiry)+'</div></button>'}).join('')}
function addCart(id){const p=prod(id),c=S.cart.find(x=>x.id===id);if(c){if(c.qty<p.stock)c.qty++}else S.cart.push({id,qty:1});$('cart').innerHTML=cartHTML()}
function qty(id,d){const c=S.cart.find(x=>x.id===id),p=prod(id);c.qty=Math.max(0,Math.min(p.stock,c.qty+d));S.cart=S.cart.filter(x=>x.qty>0);$('cart').innerHTML=cartHTML()}
function calc(){const sub=S.cart.reduce((s,c)=>s+(prod(c.id)?.price||0)*c.qty,0),disc=sub*RATE[S.disc];return{sub,disc,tot:sub-disc,rx:S.cart.some(c=>prod(c.id)?.rx)}}
function cartHTML(){const t=calc();
  const rows=S.cart.map(c=>{const p=prod(c.id);return '<tr><td>'+esc(p.name)+(p.rx?' <span class="tag r">Rx</span>':'')+'<div class="sm">'+peso(p.price)+'</div></td><td style="white-space:nowrap"><button onclick="qty(\''+c.id+'\',-1)">−</button> '+c.qty+' <button onclick="qty(\''+c.id+'\',1)">+</button></td><td style="text-align:right">'+peso(p.price*c.qty)+'</td></tr>'}).join('');
  return '<h3 style="margin:0 0 8px;color:var(--red)">Current sale</h3>'+(rows?'<table>'+rows+'</table>':'<div class="sm">Tap a product to add it.</div>')+
  '<label>Discount</label><select onchange="S.disc=this.value;$(\'cart\').innerHTML=cartHTML()"><option value="none">None</option><option value="senior"'+(S.disc==='senior'?' selected':'')+'>Senior Citizen (20%)</option><option value="pwd"'+(S.disc==='pwd'?' selected':'')+'>PWD (20%)</option></select>'+
  (S.disc!=='none'?'<label>ID number</label><input id="idn" value="'+esc(S.idn||'')+'" oninput="S.idn=this.value">':'')+
  '<div style="margin-top:10px"><div class="tot"><span>Subtotal</span><span>'+peso(t.sub)+'</span></div><div class="tot"><span>Discount</span><span>−'+peso(t.disc)+'</span></div><div class="tot big"><span>Total</span><span>'+peso(t.tot)+'</span></div></div>'+
  (t.rx?'<label style="display:flex;gap:8px;align-items:center;color:var(--red)"><input type="checkbox" id="rxok" style="width:auto"> Valid prescription verified</label>':'')+
  '<label>Cash received</label><input id="cash" type="number" min="0" step="0.01"><div style="display:flex;gap:8px;margin-top:12px"><button class="x" onclick="S.cart=[];S.disc=\'none\';$(\'cart\').innerHTML=cartHTML()">Clear</button><button class="p" style="flex:1" onclick="checkout()">Complete sale</button></div><div class="err" id="ce"></div>'}
async function checkout(){const t=calc(),e=$('ce');
  if(!S.cart.length){e.textContent='Cart is empty.';return}
  if(t.rx&&!$('rxok').checked){e.textContent='Confirm the prescription first.';return}
  if(S.disc!=='none'&&!(S.idn||'').trim()){e.textContent='Enter the discount ID number.';return}
  const cash=parseFloat(v('cash'));if(!(cash>=t.tot)){e.textContent='Cash received is less than the total.';return}
  for(const c of S.cart){const p=prod(c.id);if(!p||p.stock<c.qty||days(p.expiry)<0){e.textContent='Stock or expiry problem with '+(p?p.name:'an item')+'.';return}}
  const s={ts:Date.now(),cashier:S.me,items:S.cart.map(c=>({id:c.id,name:prod(c.id).name,qty:c.qty,price:prod(c.id).price})),subtotal:t.sub,discType:S.disc,idNo:S.disc!=='none'?S.idn:'',discount:t.disc,total:t.tot,cash,change:cash-t.tot,rx:t.rx};
  try{for(const c of S.cart)await db.collection('products').doc(c.id).update({stock:prod(c.id).stock-c.qty});const r=await db.collection('sales').add(s);S.cart=[];S.disc='none';S.idn='';receipt(s,r.id)}catch(x){e.textContent='Could not save sale: '+(x.message||x.code)}}
function receipt(s,id){modal('<div class="rc"><div style="text-align:center"><b style="font-size:17px">800+ PHARMACY</b><br>Official Receipt<br>'+new Date(s.ts).toLocaleString()+'<br>Cashier: '+esc(s.cashier)+'<br>#'+esc(String(id).slice(0,8))+'</div><hr>'+s.items.map(i=>'<div class="tot"><span>'+i.qty+' × '+esc(i.name)+'</span><span>'+peso(i.qty*i.price)+'</span></div>').join('')+'<hr><div class="tot"><span>Subtotal</span><span>'+peso(s.subtotal)+'</span></div>'+(s.discount?'<div class="tot"><span>'+(s.discType==='pwd'?'PWD':'Senior')+' discount (ID '+esc(s.idNo)+')</span><span>−'+peso(s.discount)+'</span></div>':'')+'<div class="tot"><b>TOTAL</b><b>'+peso(s.total)+'</b></div><div class="tot"><span>Cash</span><span>'+peso(s.cash)+'</span></div><div class="tot"><span>Change</span><span>'+peso(s.change)+'</span></div><hr><div style="text-align:center">Thank you!</div></div><div class="noprint" style="display:flex;gap:8px;margin-top:14px"><button class="g" onclick="window.print()">Print</button><button class="p" onclick="closeModal();render()">New sale</button></div>')}

/* ---------- ADMIN ---------- */
const TABS=[['dash','Dashboard'],['inv','Inventory'],['stock','Stock in'],['sup','Suppliers'],['rep','Reports'],['usr','Users']];
function adminHTML(){return '<div class="tabs">'+TABS.map(t=>'<button class="'+(S.tab===t[0]?'on':'')+'" onclick="S.tab=\''+t[0]+'\';render()">'+t[1]+'</button>').join('')+'</div>'+({dash:dashHTML,inv:invHTML,stock:stockHTML,sup:supHTML,rep:repHTML,usr:usrHTML})[S.tab]()}
function dashHTML0(){const today=new Date().setHours(0,0,0,0),ts=S.sales.filter(s=>s.ts>=today);
  const low=S.products.filter(p=>p.stock<=(p.reorder||0)),exp=S.products.filter(p=>days(p.expiry)<90);
  return '<div class="stats"><div class="card stat"><span class="sm">Sales today</span><b>'+peso(ts.reduce((a,s)=>a+s.total,0))+'</b></div><div class="card stat"><span class="sm">Transactions today</span><b>'+ts.length+'</b></div><div class="card stat"><span class="sm">Products</span><b>'+S.products.length+'</b></div><div class="card stat"><span class="sm">Low stock</span><b>'+low.length+'</b></div></div>'+
  '<div class="pos" style="grid-template-columns:1fr 1fr"><div class="card"><h3 style="margin-top:0;color:var(--red)">Low-stock alerts</h3>'+(low.length?'<table>'+low.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+p.stock+' left</td><td class="sm">reorder at '+(p.reorder||0)+'</td></tr>').join('')+'</table>':'<div class="sm">All stocked.</div>')+'</div><div class="card"><h3 style="margin-top:0;color:var(--red)">Expiry alerts (90 days)</h3>'+(exp.length?'<table>'+exp.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.expiry)+'</td><td>'+expTag(p.expiry)+'</td></tr>').join('')+'</table>':'<div class="sm">Nothing expiring soon.</div>')+'</div></div>'}
function invHTML(){const q=S.q.toLowerCase();const l=S.products.filter(p=>!q||[p.name,p.generic,p.category].join(' ').toLowerCase().includes(q));
  return '<div class="card"><div style="display:flex;gap:8px;margin-bottom:10px"><input placeholder="Search inventory…" value="'+esc(S.q)+'" oninput="S.q=this.value;$(\'it\').innerHTML=invRows()"><button class="p" onclick="prodForm()">+ Add</button></div><div class="tbl"><table><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Expiry</th><th>Supplier</th><th></th></tr><tbody id="it">'+invRows()+'</tbody></table></div></div>'}
function invRows(){const q=S.q.toLowerCase();return S.products.filter(p=>!q||[p.name,p.generic,p.category].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>'<tr><td>'+esc(p.name)+(p.rx?' <span class="tag r">Rx</span>':'')+'<div class="sm">'+esc(p.generic)+'</div></td><td>'+esc(p.category)+'</td><td>'+peso(p.price)+'</td><td'+(p.stock<=(p.reorder||0)?' style="color:var(--red);font-weight:700"':'')+'>'+p.stock+'</td><td>'+esc(p.expiry)+' '+expTag(p.expiry)+'</td><td>'+esc((S.suppliers.find(s=>s.id===p.supplier)||{}).name||'')+'</td><td style="white-space:nowrap"><button onclick="prodForm(\''+p.id+'\')">Edit</button> <button class="x" onclick="del(\'products\',\''+p.id+'\')">✕</button></td></tr>').join('')||'<tr><td colspan="7" class="sm">No products yet. Tap “+ Add”.</td></tr>'}
function prodForm(id){const p=id?prod(id):{};modal('<h3 style="margin-top:0;color:var(--red)">'+(id?'Edit':'Add')+' product</h3><label>Brand / name</label><input id="f1" value="'+esc(p.name)+'"><label>Generic name</label><input id="f2" value="'+esc(p.generic)+'"><label>Barcode</label><input id="f10" value="'+esc(p.barcode)+'"><div class="row2"><div><label>Category</label><input id="f3" value="'+esc(p.category)+'"></div><div><label>Price (₱)</label><input id="f4" type="number" step="0.01" value="'+esc(p.price)+'"></div><div><label>Stock</label><input id="f5" type="number" value="'+esc(p.stock||0)+'"></div><div><label>Reorder level</label><input id="f6" type="number" value="'+esc(p.reorder==null?10:p.reorder)+'"></div><div><label>Expiry date</label><input id="f7" type="date" value="'+esc(p.expiry)+'"></div><div><label>Supplier</label><select id="f8"><option value="">—</option>'+S.suppliers.map(s=>'<option value="'+s.id+'"'+(s.id===p.supplier?' selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></div></div><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="f9" style="width:auto"'+(p.rx?' checked':'')+'> Prescription-only (Rx)</label><div style="display:flex;gap:8px;margin-top:14px"><button onclick="closeModal()">Cancel</button><button class="p" style="flex:1" onclick="saveProd(\''+(id||'')+'\')">Save</button></div><div class="err" id="fe"></div>')}
async function saveProd(id){if(!v('f1').trim()||!(parseFloat(v('f4'))>=0)){$('fe').textContent='Name and price are required.';return}
  const d={name:v('f1').trim(),generic:v('f2').trim(),barcode:v('f10').trim(),category:v('f3').trim(),price:parseFloat(v('f4')),stock:parseInt(v('f5'))||0,reorder:parseInt(v('f6'))||0,expiry:v('f7'),supplier:v('f8'),rx:$('f9').checked};
  try{id?await db.collection('products').doc(id).set(d):await db.collection('products').add(d);closeModal()}catch(e){$('fe').textContent=e.message||e.code}}
async function del(c,id){if(confirm('Delete this record?'))try{await db.collection(c).doc(id).delete()}catch(e){alert(e.message||e.code)}}
function stockHTML(){return '<div class="pos" style="grid-template-columns:1fr 1fr"><div class="card"><h3 style="margin-top:0;color:var(--red)">Stock in</h3><label>Product</label><select id="s1">'+S.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' (stock '+p.stock+')</option>').join('')+'</select><div class="row2"><div><label>Quantity received</label><input id="s2" type="number" min="1"></div><div><label>Batch expiry date</label><input id="s3" type="date"></div></div><label>Supplier</label><select id="s4"><option value="">—</option>'+S.suppliers.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select><div style="margin-top:12px"><button class="p" onclick="doStockIn()">Add to inventory</button></div><div class="err" id="se"></div><p class="sm">The product’s expiry updates to the new batch date if you enter one.</p></div><div class="card"><h3 style="margin-top:0;color:var(--red)">Recent stock-ins</h3><table>'+S.stockins.sort((a,b)=>b.ts-a.ts).slice(0,15).map(s=>'<tr><td>'+esc(s.name)+'</td><td>+'+s.qty+'</td><td class="sm">'+new Date(s.ts).toLocaleDateString()+'</td></tr>').join('')+'</table></div></div>'}
async function doStockIn(){const p=prod(v('s1')),q=parseInt(v('s2'));if(!p||!(q>0)){$('se').textContent='Pick a product and quantity.';return}
  const d={stock:p.stock+q};if(v('s3'))d.expiry=v('s3');if(v('s4'))d.supplier=v('s4');
  try{await db.collection('products').doc(p.id).update(d);await db.collection('stockins').add({ts:Date.now(),pid:p.id,name:p.name,qty:q,by:S.me,supplier:v('s4')})}catch(e){$('se').textContent=e.message||e.code}}
function supHTML(){return '<div class="card"><button class="p" onclick="supForm()">+ Add supplier</button><div class="tbl" style="margin-top:10px"><table><tr><th>Supplier</th><th>Contact</th><th>Phone</th><th>Email</th><th></th></tr>'+S.suppliers.map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+esc(s.contact)+'</td><td>'+esc(s.phone)+'</td><td>'+esc(s.email)+'</td><td><button class="x" onclick="del(\'suppliers\',\''+s.id+'\')">✕</button></td></tr>').join('')+'</table></div></div>'}
function supForm(){modal('<h3 style="margin-top:0;color:var(--red)">Add supplier</h3><label>Company</label><input id="g1"><label>Contact person</label><input id="g2"><label>Phone</label><input id="g3"><label>Email</label><input id="g4"><div style="display:flex;gap:8px;margin-top:14px"><button onclick="closeModal()">Cancel</button><button class="p" style="flex:1" onclick="saveSup()">Save</button></div>')}
async function saveSup(){if(!v('g1').trim())return;await db.collection('suppliers').add({name:v('g1').trim(),contact:v('g2'),phone:v('g3'),email:v('g4')});closeModal()}
function repHTML(){const t0=new Date().setHours(0,0,0,0),from=rangeFrom(S.range),l=S.sales.filter(s=>s.ts>=from).sort((a,b)=>b.ts-a.ts);
  const by={},top={};l.forEach(s=>{by[s.cashier]=(by[s.cashier]||0)+s.total;s.items.forEach(i=>top[i.name]=(top[i.name]||0)+i.qty)});
  const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return '<div class="card"><select style="width:auto" onchange="S.range=this.value;render()"><option value="today">Today</option><option value="week"'+(S.range==='week'?' selected':'')+'>Last 7 days</option><option value="month"'+(S.range==='month'?' selected':'')+'>This month</option><option value="all"'+(S.range==='all'?' selected':'')+'>All time</option></select> <button onclick="exportSold()">\u2b07 Export quantity sold</button><div class="stats" style="margin-top:12px"><div class="card stat"><span class="sm">Revenue</span><b>'+peso(l.reduce((a,s)=>a+s.total,0))+'</b></div><div class="card stat"><span class="sm">Profit</span><b>'+peso(l.reduce((a,x)=>a+x.total-(x.cost||0),0))+'</b></div><div class="card stat"><span class="sm">Transactions</span><b>'+l.length+'</b></div><div class="card stat"><span class="sm">Discounts given</span><b>'+peso(l.reduce((a,s)=>a+s.discount,0))+'</b></div></div><div class="pos" style="grid-template-columns:1fr 1fr"><div><b>By cashier</b><table>'+Object.entries(by).map(e=>'<tr><td>'+esc(e[0])+'</td><td>'+peso(e[1])+'</td></tr>').join('')+'</table></div><div><b>Top sellers</b><table>'+tp.map(e=>'<tr><td>'+esc(e[0])+'</td><td>'+e[1]+' sold</td></tr>').join('')+'</table></div></div><b>Sales log</b><div class="tbl"><table><tr><th>Time</th><th>Cashier</th><th>Items</th><th>Total</th></tr>'+l.slice(0,100).map(s=>'<tr><td>'+new Date(s.ts).toLocaleString()+'</td><td>'+esc(s.cashier)+'</td><td>'+s.items.map(i=>i.qty+'× '+esc(i.name)).join(', ')+(s.discount?' <span class="tag">'+esc(s.discType)+'</span>':'')+(s.oversold?' <span class="tag r">OVERSOLD</span>':'')+(s.offline?' <span class="tag w">offline</span>':'')+'</td><td>'+peso(s.total)+'</td></tr>').join('')+'</table></div></div>'}

async function saveProd(id){const pr=parseFloat(v('f4')),co=parseFloat(v('f11')||'0'),e=$('fe');

  if(co>pr&&!confirm('Unit cost is higher than the sale price. Save anyway?'))return;
  const d={name:v('f1').trim(),generic:v('f2').trim(),barcode:v('f10').trim()||null,category:v('f3').trim(),price:pr,stock:parseInt(v('f5'))||0,reorder:parseInt(v('f6'))||0,expiry:v('f7')||null,supplier_id:v('f8')||null,rx:$('f9').checked};
  let r,pid=id;
  if(id)r=await sb.from('products').update(d).eq('id',id);else{r=await sb.from('products').insert(d).select('id').single();pid=r.data&&r.data.id}
  if(r.error){e.textContent=r.error.message;return}
  const c=await sb.from('product_costs').upsert({product_id:pid,cost:co||0});
  if(c.error){e.textContent='Product saved, but unit cost was not: '+c.error.message+' (run migration.sql in Supabase first)';await load('products');return}
  closeModal();await load('products');render()}

  '<label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input id="s8" type="checkbox" style="width:auto" '+(f.u?'checked':'')+' onchange="siSave()"> Update this product’s unit cost and sale price</label><div style="margin-top:12px"><button class="p" onclick="doStockIn()">Add to inventory</button></div><div class="err" id="se"></div>'}

  const c=parseFloat(v('s5')),pr=parseFloat(v('s7')),q=parseInt(v('s2')),h=$('shint');if(!h)return;
  h.innerHTML=c>0&&pr>=0?(pr<c?'<span class="neg">Selling below cost!</span> ':'')+'Profit per piece: <b>'+peso(pr-c)+'</b> · markup '+((pr-c)/c*100).toFixed(1)+'% · margin '+(pr>0?((pr-c)/pr*100).toFixed(1):'0')+'%'+(q>0?'<br>This delivery costs '+peso(q*c)+' and sells for '+peso(q*pr):''):''}
function siCalc(src){const c=parseFloat(v('s5')),m=parseFloat(v('s6')),pr=parseFloat(v('s7'));

  el.innerHTML=l.length?l.map(p=>'<button class="sr" onclick="siPick(\''+p.id+'\')"><span>'+esc(p.name)+'</span><span class="sm">'+esc(p.barcode||'')+' · stock '+p.stock+'</span></button>').join(''):'<div class="sm" style="margin-top:6px">No match. Add the product in Inventory first.</div>'}

function siClear(){S.si.pid='';S.si.f=null;$('sform').innerHTML='';$('s0').focus()}

  if(upd&&pr!==null&&!(pr>=0)){e.textContent='Sale price must be 0 or more.';return}

  S.si={pid:'',sup:v('s4'),msg:'Added '+q+' × '+p.name+(c!==null?' at '+peso(c)+' each':''),f:null};

  '<td class="r">'+(pu==null?'<span class="sm">—</span>':'<span class="'+(pu<0?'neg':'gn')+'">'+(pu<0?'−':'+')+peso(Math.abs(pu))+'</span><br><span class="mp'+(mg<20?' lo':'')+'">'+mg.toFixed(1)+'% margin</span>')+'</td>'+

 '<div class="rc"><div style="text-align:center"><b style="font-size:17px">800+ PHARMACY</b><br>Official Receipt<br>'+new Date(s.ts).toLocaleString()+'<br>Cashier: '+esc(s.cashier)+'<br>#'+esc(String(id).slice(0,8))+'</div><hr>'+
 s.items.map(i=>'<div class="tot"><span>'+i.qty+' × '+esc(i.name)+'</span><span>'+peso(i.qty*i.price)+'</span></div>').join('')+
 '<hr><div class="tot"><span>Subtotal</span><span>'+peso(s.subtotal)+'</span></div>'+(s.discount?'<div class="tot"><span>'+dl+'</span><span>−'+peso(s.discount)+'</span></div>':'')+
 '<div class="tot"><b>TOTAL</b><b>'+peso(s.total)+'</b></div><div class="tot"><span>Paid ('+esc(s.pay)+')</span><span>'+peso(s.cash)+'</span></div><div class="tot"><span>Change</span><span>'+peso(s.change)+'</span></div><hr><div style="text-align:center">Thank you!</div></div>'+
 '<div class="noprint rcb"><button class="g" onclick="printRcp()">🖨 Print receipt</button><button class="p" onclick="closeModal();render()">'+(hist?'Close':'New sale')+'</button></div>')}
function openRcp(id){const s=S.sales.find(x=>x.id===id);if(!s)return;receipt(s,id,true)}
function printRcp(){
 const el=document.querySelector('#modal .rc');if(!el){window.print();return}
 const old=$('rcf');if(old)old.remove();
 const f=document.createElement('iframe');f.id='rcf';f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
 const d=f.contentWindow.document;d.open();
 d.write('<!doctype html><html><head><meta charset="utf-8"><title>Receipt</title><style>@page{size:80mm auto;margin:3mm}body{margin:0;width:74mm;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#000}.tot{display:flex;justify-content:space-between;gap:8px;padding:2px 0}hr{border:0;border-top:1px dashed #000}</style></head><body>'+el.outerHTML+'</body></html>');
 d.close();
 setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){window.print()}},200)}
if(typeof S!=='undefined'&&S.me&&isAdmin&&isAdmin())try{render()}catch(e){}
</script>

<script id="v6js">
/* ===== v6: Purchase Orders (admin) — order from supplier, print, receive against the order ===== */
S.pos=[];S.poi=[];S.poF={st:'all',sup:'',ld:0,err:''};S.pd=null;S.pr=null;
NAV[2][1].push(['po','Purchase Orders','list']);
TITLES.po=['Purchase Orders','Order stock from suppliers and receive deliveries'];
TABS.push(['po','Purchase Orders']);
function adminHTML(){return ({dash:dashHTML,inv:invHTML,stock:stockHTML,sup:supHTML,rep:repHTML,usr:usrHTML,po:poHTML})[S.tab]()}
function go(t){S.tab=t;S.q='';S.low=false;if(t==='po')S.poF.ld=0;render();window.scrollTo(0,0)}
const sameId=(a,b)=>a!=null&&b!=null&&String(a)===String(b);
const PO_ST={ordered:['Ordered','ord'],partial:['Partly received','par'],received:['Received','rec'],cancelled:['Cancelled','can']};
const poWide=()=>{const m=document.querySelector('#modal .mb');if(m)m.style.maxWidth='920px'};
const poItems=po=>S.poi.filter(i=>sameId(i.po_id,po.id));
const poTotal=po=>poItems(po).reduce((a,i)=>a+i.qty*(+i.unit_cost||0),0);
const poSup=id=>S.suppliers.find(s=>sameId(s.id,id))||{};
const poDate=t=>t?new Date(t).toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'}):'—';

async function poLoad(){
  S.poF.ld=1;
  const a=await sb.from('purchase_orders').select('*').order('created_at',{ascending:false}).range(0,999),
        b=await sb.from('purchase_order_items').select('*').order('id').range(0,4999);
  if(a.error||b.error){S.poF.err=(a.error||b.error).message;S.pos=[];S.poi=[]}
  else{S.poF.err='';S.pos=a.data;S.poi=b.data}
  S.poF.ld=2;if(S.tab==='po')render()}
function poSet(k,v){S.poF[k]=v;render()}

function poHTML(){
  if(!S.poF.ld)poLoad();
  const F=S.poF;
  if(F.err)return '<div class="card" style="border:2px solid var(--red)"><h3 style="margin-top:0;color:var(--red)">Purchase orders need a database update</h3><p class="sm">Run <b>purchase-orders.sql</b> once in Supabase › SQL Editor, then reload this page.</p><p class="sm">'+esc(F.err)+'</p></div>';
  const open=S.pos.filter(p=>p.status==='ordered'||p.status==='partial'),
        onOrder=open.reduce((a,p)=>a+poItems(p).reduce((b,i)=>b+Math.max(i.qty-i.received_qty,0)*(+i.unit_cost||0),0),0),
        m0=new Date();m0.setDate(1);m0.setHours(0,0,0,0),
        recMonth=S.pos.filter(p=>p.status==='received'&&p.received_at&&new Date(p.received_at)>=m0).length;
  const card=(c,k,n,l)=>'<div class="ivc '+c+'"><i>'+(IC[k]?ico(k,18):ivi(k,18))+'</i><b>'+n+'</b><span>'+l+'</span></div>';
  const list=S.pos.filter(p=>(F.st==='all'||p.status===F.st)&&(!F.sup||sameId(p.supplier_id,F.sup)));
  const pill=(k,l)=>'<button class="ivp'+(F.st===k?' on':'')+'" onclick="poSet(\'st\',\''+k+'\')">'+l+'</button>';
  return '<div class="ivs">'+card('y','list',S.pos.length,'Total orders')+card('o','truck',open.length,'Open orders')+card('r','trend',peso(onOrder),'Still to receive (at cost)')+card('g','dl',recMonth,'Received this month')+'</div>'+
  '<div class="ivf">'+pill('all','All')+pill('ordered','Ordered')+pill('partial','Partly received')+pill('received','Received')+pill('cancelled','Cancelled')+
  '<select onchange="poSet(\'sup\',this.value)"><option value="">All Suppliers</option>'+S.suppliers.map(s=>'<option value="'+s.id+'"'+(sameId(F.sup,s.id)?' selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select>'+
  '<span class="sp"></span><button class="p" onclick="poNew()">+ New Purchase Order</button></div>'+
  '<div class="ivt"><div class="tbl"><table style="min-width:760px"><thead><tr><th>PO #</th><th>Supplier</th><th>Date</th><th>Expected</th><th class="r">Items</th><th class="r">Total (cost)</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+
  (F.ld!==2?'<tr><td colspan="8" class="sm" style="padding:22px;text-align:center">Loading…</td></tr>':list.map(p=>{
    const st=PO_ST[p.status]||['?','can'],can=p.status==='ordered'||p.status==='partial';
    return '<tr><td><b>'+esc(p.po_no)+'</b></td><td>'+(poSup(p.supplier_id).name?'<span class="sup">'+esc(poSup(p.supplier_id).name)+'</span>':'<span class="sm">—</span>')+'</td><td>'+poDate(p.created_at)+'</td><td>'+(p.expected?poDate(p.expected+'T00:00:00'):'<span class="sm">—</span>')+'</td><td class="r">'+poItems(p).length+'</td><td class="r"><b>'+peso(poTotal(p))+'</b></td><td><span class="sb '+st[1]+'">'+st[0]+'</span></td>'+
    '<td><div class="ia"><button title="View" onclick="poView(\''+p.id+'\')">'+ivi('eye')+'</button>'+(can?'<button title="Receive delivery" onclick="poRecv(\''+p.id+'\')">'+ico('dl',16)+'</button>':'')+'<button title="Print" onclick="poPrint(\''+p.id+'\')">🖨</button></div></td></tr>'}).join('')||'<tr><td colspan="8" class="sm" style="padding:22px;text-align:center">No purchase orders yet. Tap “+ New Purchase Order”.</td></tr>')+
  '</tbody></table></div></div>'}

/* ---------- new purchase order ---------- */
function poNew(){S.pd={sup:'',exp:'',notes:'',items:[]};poFormShow()}
function poFormShow(){
  const d=S.pd,tot=d.items.reduce((a,i)=>a+(+i.qty||0)*(+i.cost||0),0);
  modal('<h3 style="margin-top:0;color:var(--red)">New purchase order</h3>'+
  '<div class="row2"><div><label>Supplier</label><select onchange="S.pd.sup=this.value;poFormShow()"><option value="">Select supplier</option>'+S.suppliers.map(s=>'<option value="'+s.id+'"'+(sameId(d.sup,s.id)?' selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></div>'+
  '<div><label>Expected delivery (optional)</label><input type="date" value="'+esc(d.exp)+'" oninput="S.pd.exp=this.value"></div></div>'+
  '<label>Add product — type the name or scan the barcode</label><input id="pq" autocomplete="off" placeholder="Search…" oninput="poFind()" onkeydown="if(event.key===\'Enter\')poEnter()"><div id="pres"></div>'+
  '<div style="margin:8px 0"><button onclick="poSuggest()">+ Add low-stock items'+(d.sup?' from this supplier':'')+'</button></div>'+
  '<div class="tbl"><table class="pol"><tr><th>Product</th><th class="r">Qty</th><th class="r">Unit cost (₱)</th><th class="r">Total</th><th></th></tr>'+
  (d.items.map((i,n)=>'<tr><td><b>'+esc(i.name)+'</b><div class="sm">in stock '+i.stock+'</div></td><td class="r"><input type="number" min="1" inputmode="numeric" style="width:80px" value="'+esc(i.qty)+'" oninput="poLine('+n+',\'qty\',this.value)"></td><td class="r"><input type="number" min="0" step="0.01" inputmode="decimal" style="width:96px" value="'+esc(i.cost)+'" oninput="poLine('+n+',\'cost\',this.value)"></td><td class="r" id="plt'+n+'">'+peso((+i.qty||0)*(+i.cost||0))+'</td><td><button class="x" onclick="poRm('+n+')">✕</button></td></tr>').join('')||'<tr><td colspan="5" class="sm">No items yet. Search a product above.</td></tr>')+
  '</table></div><div class="tot big"><span>Order total</span><span id="pot">'+peso(tot)+'</span></div>'+
  '<label>Notes (optional)</label><input value="'+esc(d.notes)+'" oninput="S.pd.notes=this.value">'+
  '<div style="display:flex;gap:8px;margin-top:14px"><button onclick="closeModal()">Cancel</button><button class="p" style="flex:1" onclick="poSave()">Save purchase order</button></div><div class="err" id="poe"></div>');
  poWide()}
function poLine(n,k,val){const i=S.pd.items[n];if(!i)return;i[k]=val;const t=$('plt'+n);if(t)t.textContent=peso((+i.qty||0)*(+i.cost||0));$('pot').textContent=peso(S.pd.items.reduce((a,x)=>a+(+x.qty||0)*(+x.cost||0),0))}
function poRm(n){S.pd.items.splice(n,1);poFormShow()}
function poAddP(p){const ex=S.pd.items.find(i=>sameId(i.pid,p.id));if(ex){ex.qty=(+ex.qty||0)+1;return}
  const r=p.reorder||0;S.pd.items.push({pid:p.id,name:p.name,stock:p.stock,qty:p.stock<=r?Math.max(r*2-p.stock,1):1,cost:p.cost>0?p.cost:''})}
function poAdd(id){const p=prod(id);if(!p)return;poAddP(p);poFormShow();const q=$('pq');if(q)q.focus()}
function poFind(){const q=v('pq').trim().toLowerCase(),el=$('pres');if(!q){el.innerHTML='';return}
  const l=S.products.filter(p=>[p.name,p.generic,p.barcode,p.itemNo].join(' ').toLowerCase().includes(q)).slice(0,8);
  el.innerHTML=l.length?l.map(p=>'<button onclick="poAdd(\''+p.id+'\')"><span>'+esc(p.name)+'</span><span class="sm">'+esc(p.barcode||'')+' · stock '+p.stock+'</span></button>').join(''):'<div class="sm" style="margin-top:6px">No match. Add the product in Inventory first.</div>'}
function poEnter(){const q=v('pq').trim().toLowerCase();if(!q)return;let m=S.products.filter(p=>(p.barcode&&p.barcode.toLowerCase()===q)||(p.itemNo&&String(p.itemNo).toLowerCase()===q));if(!m.length){const l=S.products.filter(p=>[p.name,p.generic,p.barcode,p.itemNo].join(' ').toLowerCase().includes(q));if(l.length===1)m=l}if(m.length)poAdd(m[0].id)}
function poSuggest(){const l=S.products.filter(p=>p.stock<=(p.reorder||0)&&(!S.pd.sup||sameId(p.supplier,S.pd.sup)));
  if(!l.length){const e=$('poe');if(e)e.textContent='No low-stock items'+(S.pd.sup?' for this supplier':'')+'.';return}
  l.forEach(poAddP);poFormShow()}
async function poSave(){
  const d=S.pd,e=$('poe');
  if(!d.sup){e.textContent='Choose a supplier.';return}
  if(!d.items.length){e.textContent='Add at least one product.';return}
  if(d.items.some(i=>!(parseInt(i.qty)>0)||!(parseFloat(i.cost)>=0))){e.textContent='Every item needs a quantity and a unit cost (0 or more).';return}
  const t=new Date(),ymd=String(t.getFullYear()).slice(2)+String(t.getMonth()+1).padStart(2,'0')+String(t.getDate()).padStart(2,'0'),
        no='PO-'+ymd+'-'+String(S.pos.filter(p=>(p.po_no||'').startsWith('PO-'+ymd)).length+1).padStart(3,'0');
  const h=await sb.from('purchase_orders').insert({po_no:no,supplier_id:d.sup,status:'ordered',expected:d.exp||null,notes:d.notes||'',created_by:S.me}).select('id').single();
  if(h.error){e.textContent=h.error.message;return}
  const r=await sb.from('purchase_order_items').insert(d.items.map(i=>({po_id:h.data.id,product_id:i.pid,name:i.name,qty:parseInt(i.qty),unit_cost:parseFloat(i.cost),received_qty:0})));
  if(r.error){await sb.from('purchase_orders').delete().eq('id',h.data.id);e.textContent=r.error.message;return}
  S.pd=null;await poLoad();poView(h.data.id)}

/* ---------- view / cancel / print ---------- */
function poView(id){
  const p=S.pos.find(x=>sameId(x.id,id));if(!p)return;const st=PO_ST[p.status]||['?','can'],it=poItems(p),sp=poSup(p.supplier_id),can=p.status==='ordered'||p.status==='partial',none=!it.some(i=>i.received_qty>0);
  modal('<div class="ch"><h3 style="margin:0;color:var(--red)">'+esc(p.po_no)+'</h3><span class="sb '+st[1]+'">'+st[0]+'</span></div>'+
  '<div class="sm" style="margin-bottom:10px">'+esc(sp.name||'—')+' · ordered '+poDate(p.created_at)+(p.expected?' · expected '+poDate(p.expected+'T00:00:00'):'')+(p.created_by?' · by '+esc(p.created_by):'')+'</div>'+
  '<div class="tbl"><table><tr><th>Product</th><th class="r">Ordered</th><th class="r">Received</th><th class="r">Unit cost</th><th class="r">Total</th></tr>'+
  it.map(i=>'<tr><td>'+esc(i.name)+'</td><td class="r">'+i.qty+'</td><td class="r'+(i.received_qty>=i.qty?'':' neg')+'">'+i.received_qty+'</td><td class="r">'+peso(i.unit_cost)+'</td><td class="r">'+peso(i.qty*i.unit_cost)+'</td></tr>').join('')+'</table></div>'+
  '<div class="tot big"><span>Order total</span><span>'+peso(poTotal(p))+'</span></div>'+(p.notes?'<div class="sm">Notes: '+esc(p.notes)+'</div>':'')+
  '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button onclick="closeModal()">Close</button><button onclick="poPrint(\''+p.id+'\')">🖨 Print</button>'+
  (p.status==='ordered'&&none?'<button class="x" onclick="poCancel(\''+p.id+'\')">Cancel order</button>':'')+(p.status==='partial'?'<button onclick="poFinish(\''+p.id+'\')">Close order</button>':'')+
  (can?'<button class="g" style="flex:1" onclick="poRecv(\''+p.id+'\')">Receive delivery</button>':'')+'</div>');poWide()}
async function poCancel(id){if(!confirm('Cancel this purchase order?'))return;const r=await sb.from('purchase_orders').update({status:'cancelled'}).eq('id',id);if(r.error)return alert(r.error.message);await poLoad();poView(id)}
async function poFinish(id){if(!confirm('Mark this order as complete? Items not yet delivered will no longer be expected.'))return;const r=await sb.from('purchase_orders').update({status:'received',received_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);await poLoad();poView(id)}
function printDoc(title,body,css){
  const old=$('rcf');if(old)old.remove();
  const f=document.createElement('iframe');f.id='rcf';f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
  const d=f.contentWindow.document;d.open();d.write('<!doctype html><html><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>'+css+'</style></head><body>'+body+'</body></html>');d.close();
  setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){window.print()}},200)}
function poPrint(id){
  const p=S.pos.find(x=>sameId(x.id,id));if(!p)return;const it=poItems(p),sp=poSup(p.supplier_id);
  printDoc(p.po_no,'<h1>800+ PHARMACY</h1><h2>PURCHASE ORDER</h2><div class="meta"><div><b>PO #:</b> '+esc(p.po_no)+'<br><b>Date:</b> '+poDate(p.created_at)+(p.expected?'<br><b>Expected delivery:</b> '+poDate(p.expected+'T00:00:00'):'')+'</div><div><b>Supplier:</b> '+esc(sp.name||'—')+(sp.contact?'<br>'+esc(sp.contact):'')+(sp.phone?'<br>'+esc(sp.phone):'')+(sp.email?'<br>'+esc(sp.email):'')+'</div></div>'+
   '<table><tr><th>#</th><th>Product</th><th class="r">Qty</th><th class="r">Unit cost</th><th class="r">Total</th></tr>'+it.map((i,n)=>'<tr><td>'+(n+1)+'</td><td>'+esc(i.name)+'</td><td class="r">'+i.qty+'</td><td class="r">'+peso(i.unit_cost)+'</td><td class="r">'+peso(i.qty*i.unit_cost)+'</td></tr>').join('')+'<tr><td colspan="4" class="r"><b>TOTAL</b></td><td class="r"><b>'+peso(poTotal(p))+'</b></td></tr></table>'+
   (p.notes?'<p><b>Notes:</b> '+esc(p.notes)+'</p>':'')+'<div class="sig"><div>Prepared by<br><br>______________________</div><div>Approved by<br><br>______________________</div></div>',
   '@page{size:A4;margin:14mm}body{font:13px/1.5 Arial,sans-serif;color:#000}h1{margin:0;font-size:22px;color:#8a0d14}h2{margin:2px 0 14px;font-size:15px;letter-spacing:.12em}.meta{display:flex;justify-content:space-between;gap:20px;margin-bottom:14px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #999;padding:6px 8px;text-align:left}th{background:#f2e8d3}.r{text-align:right}.sig{display:flex;justify-content:space-between;margin-top:50px}')}

/* ---------- receive a delivery against a purchase order ---------- */
function poRecv(id){
  const p=S.pos.find(x=>sameId(x.id,id));if(!p)return;
  const rows=poItems(p).filter(i=>i.qty-i.received_qty>0).map(i=>{const pr=S.products.find(x=>sameId(x.id,i.product_id));return{iid:i.id,pid:i.product_id,name:i.name,ord:i.qty,got:i.received_qty,cost:+i.unit_cost||0,price:pr?pr.price:0,stock:pr?pr.stock:0,found:!!pr}});
  if(!rows.length){alert('Nothing left to receive on this order.');return}
  S.pr={id,rows};
  modal('<h3 style="margin-top:0;color:var(--red)">Receive delivery — '+esc(p.po_no)+'</h3><div class="sm" style="margin-bottom:10px">'+esc(poSup(p.supplier_id).name||'')+'. Enter what actually arrived. Set the markup % to get the sale price (or type the price and the markup fills in).</div>'+
  rows.map((r,n)=>{const m=r.cost>0&&r.price>0?(((r.price-r.cost)/r.cost)*100).toFixed(1):'';
   return '<div class="rcv"><b>'+esc(r.name)+'</b> <span class="sm">ordered '+r.ord+' · already received '+r.got+' · in stock '+r.stock+(r.found?'':' · <span class="neg">product not found</span>')+'</span>'+
   '<div class="rg" style="margin-top:8px"><div><label>Qty received</label><input id="rq'+n+'" type="number" min="0" inputmode="numeric" value="'+(r.ord-r.got)+'" oninput="rcTot()"></div>'+
   '<div><label>Unit cost (₱)</label><input id="rc'+n+'" type="number" min="0" step="0.01" inputmode="decimal" value="'+r.cost+'" oninput="rcCalc('+n+',\'c\')"></div>'+
   '<div><label>Markup %</label><input id="rm'+n+'" type="number" min="0" step="0.1" inputmode="decimal" value="'+m+'" oninput="rcCalc('+n+',\'m\')"></div>'+
   '<div><label>Sale price (₱)</label><input id="rp'+n+'" type="number" min="0" step="0.01" inputmode="decimal" value="'+r.price+'" oninput="rcCalc('+n+',\'p\')"></div>'+
   '<div><label>Expiry date</label><input id="re'+n+'" type="date"></div></div>'+
   '<div class="hint" id="rh'+n+'"></div><button style="padding:4px 10px;font-size:12px" onclick="rcRound('+n+')">Round price up to a whole peso</button></div>'}).join('')+
  '<label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input id="rupd" type="checkbox" checked style="width:auto"> Update each product’s unit cost and sale price</label><div class="tot big"><span>This delivery costs</span><span id="rtot"></span></div>'+
  '<div style="display:flex;gap:8px;margin-top:14px"><button onclick="poView(\''+id+'\')">Back</button><button class="p" style="flex:1" id="rbtn" onclick="poRecvSave()">Add to inventory</button></div><div class="err" id="rce"></div>');
  poWide();rows.forEach((r,n)=>rcHint(n));rcTot()}
function rcHint(n){const c=parseFloat(v('rc'+n)),pr=parseFloat(v('rp'+n)),h=$('rh'+n);if(!h)return;

  '<div><label>Stock</label><input id="f5" type="number" value="'+esc(p.stock||0)+'"></div><div><label>Reorder level</label><input id="f6" type="number" value="'+esc(p.reorder==null?10:p.reorder)+'"></div><div><label>Expiry date</label><input id="f7" type="date" value="'+esc(p.expiry)+'"></div></div>'+
  '<div class="hint" id="mgn"></div><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="f9" style="width:auto"'+(p.rx?' checked':'')+'> Prescription-only (Rx)</label><div style="display:flex;gap:8px;margin-top:14px"><button onclick="closeModal()">Cancel</button><button class="p" style="flex:1" onclick="saveProd(\''+(id||'')+'\')">Save</button></div><div class="err" id="fe"></div>');divFill();mgPrev()}
async function saveProd(id){
  const pr=parseFloat(v('f4')),co=parseFloat(v('f11')||'0'),e=$('fe');
  if(!v('f1').trim()||!(pr>=0)){e.textContent='Name and sale price are required.';return}
  if(!(co>=0)){e.textContent='Unit cost must be 0 or more.';return}
  if(co>pr&&!confirm('Unit cost is higher than the sale price. Save anyway?'))return;
  const d={item_no:v('f0').trim()||null,name:v('f1').trim(),generic:v('f2').trim(),barcode:v('f10').trim()||null,category:v('f3').trim(),price:pr,stock:parseInt(v('f5'))||0,reorder:parseInt(v('f6'))||0,expiry:v('f7')||null,supplier_id:v('f8')||null,rx:$('f9').checked};
  let r,pid=id;
  if(id)r=await sb.from('products').update(d).eq('id',id);else{r=await sb.from('products').insert(d).select('id').single();pid=r.data&&r.data.id}
  if(r.error){e.textContent=/item_no/.test(r.error.message)?'The database needs add-item-no.sql first (see README).':r.error.message;return}
  const c=await sb.from('product_costs').upsert({product_id:pid,cost:co||0});
  if(c.error){e.textContent='Product saved, but unit cost was not: '+c.error.message+' (run migration.sql in Supabase first)';await load('products');return}
  closeModal();await load('products');render()}
</script>
<script id="v11js">
/* ===== v11: shifts + X reading (per cashier) + Z reading (whole day) ===== */
S.shift=null;S.shiftState=0;S.endedShift=null;S.shiftOff=false;S.shiftMissing=false;S.zr=[];S.shl=[];S.zrLd=0;S.zrErr='';
const isCash=()=>{const u=user();return !!u&&u.role!=='admin'};
const fT=t=>t?new Date(t).toLocaleString('en-US',{month:'2-digit',day:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const fTm=t=>t?new Date(t).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}):'—';
const sgn=n=>(n<0?'−':'+')+peso(Math.abs(+n||0));
async function rpcJ(fn,args){
  const {data,error}=await sb.rpc(fn,args||{});
  if(error){const m=error.message||'Error';throw new Error(/could not find the function|schema cache/i.test(m)?'The database needs shifts.sql first (see README).':m)}
  return data}

/* ---------- load / gate / sidebar card ---------- */
async function loadShift(){
  try{
    const {data,error}=await sb.from('shifts').select('*').eq('cashier_id',S.uid).is('ended_at',null).order('started_at',{ascending:false}).limit(1);
    if(error)throw error;
    S.shift=data[0]||null;S.shiftOff=false;S.shiftMissing=false;LS.set('pos_shift',{uid:S.uid,shift:S.shift})
  }catch(e){
    const m=String(e.message||e),c=LS.get('pos_shift',null);
    if(navigator.onLine&&/relation|does not exist|schema cache|could not find/i.test(m)){S.shiftOff=true;S.shiftMissing=true;S.shift=null}
    else if(c&&c.uid===S.uid){S.shift=c.shift}
    else{S.shiftOff=true;S.shift=null}   // offline and nothing saved: do not block selling
  }
  S.shiftState=2;render()}
function shiftHook(){
  if(!S.me||!S.uid){S.shiftState=0;S.shift=null;S.endedShift=null;return}
  if(!isCash())return;
  if(S.shiftState===0){S.shiftState=1;loadShift();return}
  if(S.shiftState!==2)return;
  shiftPaint();
  if(!S.shiftOff&&!S.shift&&!document.querySelector('#modal .mb'))shiftGate()}
(function(){const r0=render;render=function(){r0();try{shiftHook()}catch(e){console.error(e)}}})();
(function(){const c0=checkout;checkout=function(){
  if(isCash()&&!S.shiftOff&&!S.shift){if(S.shiftState!==2){alert('Checking your shift. Try again in a moment.');return}shiftGate();return}
  return c0.apply(this,arguments)}})();
(function(){const g0=go;go=function(t){if(t==='rep')S.zrLd=0;return g0(t)}})();
function shiftPaint(){
  const st=$('st');if(!st||$('shf'))return;
  let h;
  if(S.shiftMissing)h='<div class="sc" id="shf"><span>SHIFT</span><b style="font-size:14px">Not set up</b><span>Run shifts.sql in Supabase</span></div>';
  else if(S.shiftOff)return;
  else if(S.shift)h='<div class="sc" id="shf"><span>SHIFT OPEN</span><b style="font-size:17px">since '+fTm(S.shift.started_at)+'</b><span>Opening cash '+peso(+S.shift.opening_cash||0)+'</span><div class="qa" style="margin-top:8px"><button onclick="xRead()">X Reading</button><button onclick="shiftEndAsk()">End Shift</button></div></div>';
  else h='<div class="sc" id="shf"><span>SHIFT</span><b style="font-size:17px">Not started</b><div class="qa" style="margin-top:8px"><button onclick="shiftGate()">Start Shift</button></div></div>';
  st.insertAdjacentHTML('beforebegin',h)}
function shiftGate(){if(S.endedShift)showEnded();else shiftStartAsk(true)}

/* ---------- start shift ---------- */
function shiftStartAsk(gate){
  const u=user();
  modal('<h3 style="margin-top:0;color:var(--red)">Start shift</h3><div class="sm" style="margin-bottom:10px">Cashier: <b>'+esc(u.name||u.username)+'</b> · '+fT(new Date())+'</div><label>Opening cash in the drawer (₱)</label><input id="sh_open" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">'+
  '<div style="display:flex;gap:8px;margin-top:14px">'+(gate?'<button onclick="closeModal();logout()">Logout</button>':'<button onclick="closeModal()">Cancel</button>')+'<button class="p" style="flex:1" id="sh_btn" onclick="shiftStart()">Start shift</button></div><div class="err" id="sh_e"></div><div class="sm" style="margin-top:8px">A shift must be started before you can sell.</div>')}
async function shiftStart(){
  const e=$('sh_e'),b=$('sh_btn'),o=parseFloat(v('sh_open')||'0');
  if(!(o>=0)){e.textContent='Opening cash must be 0 or more.';return}
  if(!navigator.onLine){e.textContent='Connect to the internet to start a shift.';return}
  b.disabled=true;
  try{S.shift=await rpcJ('start_shift',{opening:o});S.endedShift=null;LS.set('pos_shift',{uid:S.uid,shift:S.shift});closeModal();render()}
  catch(x){e.textContent=x.message;b.disabled=false}}

/* ---------- reading documents (58mm) ---------- */
const RD={dash:'<div style="border-top:2px dashed #000;margin:9px 0"></div>',
  row:(l,r,b)=>'<div style="display:flex;justify-content:space-between;gap:6px;align-items:baseline'+(b?';font-weight:800':'')+'"><span>'+l+'</span><span>'+r+'</span></div>',
  head:t=>'<div style="font-weight:900;font-size:12px;letter-spacing:.06em;margin:2px 0 4px">'+t+'</div>'};
const PAYN={cash:'Cash',gcash:'GCash',card:'Card'};
function payRows(sm){const bp=sm.by_pay||{},g=k=>bp[k]||{count:0,amount:0},ks=['cash','gcash','card'].concat(Object.keys(bp).filter(k=>!PAYN[k]));return ks.map(k=>[k,g(k)])}
function rdDoc(kind,sm,i){
  const r=RD.row,d=RD.dash,vd=sm.voided||{};
  let h='<div style="text-align:center;font-size:20px;font-weight:900">'+esc(STORE.name)+'</div>'+(STORE.addr?'<div style="text-align:center;font-size:12px">'+esc(STORE.addr)+'</div>':'')+
    '<div style="text-align:center;font-size:17px;font-weight:900;margin-top:8px;letter-spacing:.04em">'+(kind==='Z'?'Z READING':'X READING')+'</div><div style="text-align:center;font-size:12px">'+(kind==='Z'?'End of day report (whole store)':i.all?'All cashiers, since last Z reading':'Shift report')+'</div>'+(i.reprint?'<div style="text-align:center;font-weight:800;font-size:12px;margin-top:4px">*** REPRINT ***</div>':'')+d;
  if(kind==='Z')h+=r('Z No.',String(i.z_no).padStart(6,'0'),1);
  if(kind==='X'&&!i.all)h+=r('Cashier',esc(i.cashier));
  h+=r(kind==='X'&&!i.all?'Shift start':'From',fT(i.from))+(i.to?r(kind==='X'&&!i.all?'Shift end':'To',fT(i.to)):'')+r('Printed',fT(new Date()));
  if(kind==='Z')h+=r('Issued by',esc(i.by));
  h+=d+RD.head('SALES SUMMARY')+r('Transactions',sm.count||0)+r('Gross sales',peso(+sm.gross||0))+r('Discounts','−'+peso(+sm.discount||0))+r('NET SALES',peso(+sm.net||0),1)+
     d+RD.head('PAYMENT METHOD')+payRows(sm).map(([k,x])=>r((PAYN[k]||esc(k))+' ('+x.count+')',peso(+x.amount||0))).join('')+
     d+RD.head('VOIDED (not counted)')+r('Voided sales ('+(vd.count||0)+')',peso(+vd.amount||0));
  if(kind==='X'&&!i.all&&i.opening!=null){
    const cash=+((sm.by_pay||{}).cash||{}).amount||0,exp=(+i.opening||0)+cash;
    h+=d+RD.head('CASH DRAWER')+r('Opening cash',peso(+i.opening||0))+r('+ Cash sales',peso(cash))+r('Expected cash',peso(exp),1)+(i.counted!=null?r('Counted cash',peso(+i.counted))+r('Over / Short',sgn(i.counted-exp),1):'')}
  if(kind==='Z'||i.all){
    h+=d+RD.head('PER CASHIER')+((sm.by_cashier||[]).map(c=>'<div style="margin-bottom:6px"><div style="font-weight:800">'+esc(c.cashier)+'</div>'+r('Transactions',c.count)+r('Net sales',peso(+c.net||0),1)+r('Cash',peso(+c.cash||0))+r('GCash',peso(+c.gcash||0))+r('Card',peso(+c.card||0))+'</div>').join('')||'<div>No sales</div>')}
  if(kind==='Z'&&(sm.shifts||[]).length){
    let tot=0,any=false;
    h+=d+RD.head('SHIFTS')+sm.shifts.map(s=>{const os=s.over_short;if(os!=null){tot+=+os;any=true}return '<div style="margin-bottom:5px"><div style="font-weight:800">'+esc(s.cashier)+'</div>'+r(fTm(s.started_at)+' – '+fTm(s.ended_at),os==null?'not counted':sgn(os))+'</div>'}).join('')+(any?r('Total over / short',sgn(tot),1):'')}
  h+=d+'<div style="margin-top:12px">'+(kind==='X'&&!i.all?'Cashier: ________________':'Prepared by: ________________')+'</div><div style="margin-top:14px">Checked by: ________________</div>'+
     '<div style="text-align:center;font-weight:900;margin-top:12px">*** '+(kind==='Z'?'END OF DAY - Z READING':'X READING')+' ***</div>';
  return h}
function showReading(kind,sm,info,btns){
  modal('<div class="rd" style="font:600 13.5px/1.5 Arial,Helvetica,sans-serif;color:#000;background:#fff;padding:18px 14px 22px;border-radius:10px">'+rdDoc(kind,sm,info)+'</div><div class="noprint rcb" style="flex-wrap:wrap">'+(btns||[]).map(b=>'<button class="'+(b[2]||'')+'" onclick="'+b[1]+'">'+b[0]+'</button>').join('')+'</div>')}
function printRd(){
  const el=document.querySelector('#modal .rd');if(!el){window.print();return}
  printDoc('Reading',el.outerHTML+'<div style="height:24mm"></div>','@page{size:58mm auto;margin:0}html,body{margin:0;padding:0;background:#fff}body{width:46mm;margin:0 auto;padding:2mm 0;color:#000;font:600 13px Arial,Helvetica,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}.rd{padding:0!important;border-radius:0!important;background:#fff!important}')}

/* ---------- X reading (mid-shift, does not close the shift) ---------- */
async function xRead(){
  if(!S.shift)return;
  try{const sm=await rpcJ('sales_summary',{t_from:S.shift.started_at,t_to:null,who:S.me});
    showReading('X',sm,{cashier:S.me,from:S.shift.started_at,to:null,opening:+S.shift.opening_cash||0},[['🖨 Print X reading','printRd()','g'],['Close','closeModal()','p']])}
  catch(x){alert(x.message)}}

/* ---------- end shift ---------- */
async function shiftEndAsk(){
  if(!S.shift)return;
  if(LS.get('pos_q',[]).length){alert('Some sales are still waiting to sync. Connect to the internet and wait until they are synced before ending the shift.');return}
  if(!navigator.onLine){alert('Connect to the internet to end the shift.');return}
  let sm;try{sm=await rpcJ('sales_summary',{t_from:S.shift.started_at,t_to:null,who:S.me})}catch(x){alert(x.message);return}
  const cash=+((sm.by_pay||{}).cash||{}).amount||0,exp=(+S.shift.opening_cash||0)+cash,r=RD.row;S.endExp=exp;
  modal('<h3 style="margin-top:0;color:var(--red)">End shift</h3><div style="font-weight:600;font-size:14px">'+r('Transactions',sm.count||0)+r('Net sales',peso(+sm.net||0),1)+payRows(sm).map(([k,x])=>r((PAYN[k]||esc(k)),peso(+x.amount||0))).join('')+'<div style="border-top:1px dashed var(--bd);margin:8px 0"></div>'+r('Opening cash',peso(+S.shift.opening_cash||0))+r('Expected cash in drawer',peso(exp),1)+'</div>'+
  '<label>Cash counted in the drawer (₱)</label><input id="sh_cnt" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" oninput="shiftOS()"><div id="sh_os" style="font-weight:700;margin-top:6px"></div>'+
  '<div style="display:flex;gap:8px;margin-top:14px"><button onclick="closeModal()">Cancel</button><button class="p" style="flex:1" id="sh_btn" onclick="shiftEnd()">End shift &amp; show X reading</button></div><div class="err" id="sh_e"></div>')}
function shiftOS(){const c=parseFloat(v('sh_cnt')),el=$('sh_os');el.textContent=isNaN(c)?'':'Over / Short: '+sgn(c-S.endExp)}
async function shiftEnd(){
  const c=parseFloat(v('sh_cnt')),e=$('sh_e'),b=$('sh_btn');
  if(isNaN(c)||c<0){e.textContent='Enter the cash counted in the drawer.';return}
  if(LS.get('pos_q',[]).length){e.textContent='Some sales are still waiting to sync.';return}
  if(!confirm('End your shift now? You will need to start a new shift to sell again.'))return;
  b.disabled=true;
  try{const row=await rpcJ('end_shift',{sid:S.shift.id,counted:c});S.endedShift=row;S.shift=null;LS.set('pos_shift',{uid:S.uid,shift:null});showEnded()}
  catch(x){e.textContent=x.message;b.disabled=false}}
function showEnded(){
  const r=S.endedShift;if(!r)return closeModal();
  showReading('X',r.summary||{},{cashier:r.cashier,from:r.started_at,to:r.ended_at,opening:+r.opening_cash||0,counted:r.closing_cash==null?null:+r.closing_cash},
    [['🖨 Print X reading','printRd()','g'],['Z reading (end of day)','zAsk()'],['Start new shift','S.endedShift=null;shiftStartAsk(true)','p'],['Logout','S.endedShift=null;closeModal();logout()']])}

/* ---------- Z reading (whole store, closes the day) ---------- */
function zAsk(){
  const back=S.endedShift?'showEnded()':'closeModal()';
  modal('<h3 style="margin-top:0;color:var(--red)">Issue Z reading?</h3><p class="sm">The Z reading is the end-of-day report for the <b>whole store</b>: every cashier, every sale since the last Z reading. It gets the next Z number and cannot be undone. All cashiers must have ended their shift first.</p><div style="display:flex;gap:8px"><button onclick="'+back+'">Cancel</button><button class="p" style="flex:1" id="z_btn" onclick="zIssue()">Issue Z reading</button></div><div class="err" id="z_e"></div>')}
async function zIssue(){
  const b=$('z_btn');b.disabled=true;
  try{const z=await rpcJ('issue_z_reading');S.zrLd=0;zShow(z,false)}
  catch(x){$('z_e').textContent=x.message;b.disabled=false}}
function zShow(z,re){
  const s=z.summary||{};
  showReading('Z',s,{z_no:z.z_no,from:z.period_start,to:z.period_end,by:z.created_by,reprint:re},[['🖨 Print Z reading','printRd()','g'],S.endedShift?['Back','showEnded()']:['Close','closeModal();render()','p']])}

/* ---------- admin: Reports page card ---------- */
async function loadZ(){
  S.zrLd=1;
  try{
    const a=await sb.from('z_readings').select('*').order('z_no',{ascending:false}).limit(30),
          b=await sb.from('shifts').select('*').order('started_at',{ascending:false}).limit(30);
    if(a.error||b.error)throw (a.error||b.error);
    S.zr=a.data;S.shl=b.data;S.zrErr=''
  }catch(e){S.zrErr=String(e.message||e)}
  S.zrLd=2;if(S.tab==='rep')render()}
async function xAll(){
  try{
    const last=S.zr&&S.zr[0],from=last?last.period_end:new Date(new Date().setHours(0,0,0,0)).toISOString(),
          sm=await rpcJ('sales_summary',{t_from:from,t_to:null,who:null});
    showReading('X',sm,{all:true,from,to:null,cashier:''},[['🖨 Print X reading','printRd()','g'],['Close','closeModal()','p']])}
  catch(x){alert(x.message)}}
function shiftReprint(i){const r=S.shl[i];if(!r||!r.summary)return;
  showReading('X',r.summary,{cashier:r.cashier,from:r.started_at,to:r.ended_at,opening:+r.opening_cash||0,counted:r.closing_cash==null?null:+r.closing_cash,reprint:true},[['🖨 Print X reading','printRd()','g'],['Close','closeModal()','p']])}
async function forceEnd(i){
  const r=S.shl[i];if(!r||r.ended_at)return;
  if(!confirm('End '+r.cashier+'\'s shift now? Cash will be recorded as not counted.'))return;
  try{await rpcJ('end_shift',{sid:r.id,counted:null});S.zrLd=0;render()}catch(x){alert(x.message)}}
function readingsHTML(){
  if(!S.zrLd)loadZ();
  const open=S.shl.map((s,i)=>[s,i]).filter(x=>!x[0].ended_at);
  if(S.zrErr)return '<div class="card" style="margin-top:14px"><h3 style="margin-top:0">Shifts &amp; readings</h3><p class="sm">'+(/relation|does not exist|schema cache|could not find/i.test(S.zrErr)?'Run <b>shifts.sql</b> once in Supabase › SQL Editor to turn this on.':esc(S.zrErr))+'</p></div>';
  return '<div class="card" style="margin-top:14px"><h3 style="margin-top:0">Shifts &amp; readings</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="xAll()">X reading (all cashiers)</button><button class="p" onclick="zAsk()">Issue Z reading</button></div>'+
  (open.length?'<h4>Open shifts</h4><div class="tbl"><table><tr><th>Cashier</th><th>Started</th><th></th></tr>'+open.map(([s,i])=>'<tr><td>'+esc(s.cashier)+'</td><td>'+fT(s.started_at)+'</td><td><button class="x" onclick="forceEnd('+i+')">Force end</button></td></tr>').join('')+'</table></div>':'')+
  '<h4>Z readings</h4><div class="tbl"><table><tr><th>Z No.</th><th>Issued</th><th>Period</th><th class="r">Net sales</th><th>By</th><th></th></tr>'+
  (S.zr.map((z,i)=>'<tr><td><b>'+String(z.z_no).padStart(6,'0')+'</b></td><td>'+fT(z.created_at)+'</td><td>'+fT(z.period_start)+' – '+fT(z.period_end)+'</td><td class="r">'+peso(+(z.summary||{}).net||0)+'</td><td>'+esc(z.created_by)+'</td><td><button onclick="zShow(S.zr['+i+'],true)">Reprint</button></td></tr>').join('')||'<tr><td colspan="6" class="sm">No Z readings yet.</td></tr>')+'</table></div>'+
  '<h4>Recent shifts</h4><div class="tbl"><table><tr><th>Cashier</th><th>Start</th><th>End</th><th class="r">Opening</th><th class="r">Counted</th><th class="r">Over / Short</th><th></th></tr>'+
  (S.shl.map((s,i)=>{const os=s.closing_cash==null||s.expected_cash==null?null:s.closing_cash-s.expected_cash;return '<tr><td>'+esc(s.cashier)+'</td><td>'+fT(s.started_at)+'</td><td>'+(s.ended_at?fT(s.ended_at):'<b>OPEN</b>')+'</td><td class="r">'+peso(+s.opening_cash||0)+'</td><td class="r">'+(s.closing_cash==null?'—':peso(+s.closing_cash))+'</td><td class="r '+(os!=null&&os<0?'neg':'')+'">'+(os==null?'—':sgn(os))+'</td><td>'+(s.ended_at?'<button onclick="shiftReprint('+i+')">X</button>':'')+'</td></tr>'}).join('')||'<tr><td colspan="7" class="sm">No shifts yet.</td></tr>')+'</table></div></div>'}
(function(){const r=repHTML;repHTML=function(){return r()+readingsHTML()}})();
</script>
